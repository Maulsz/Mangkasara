<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E9E2D9" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D18A70" />
      <stop offset="100%" stop-color="#BD6249" />
    </linearGradient>
  </defs>
  
  <!-- Latar belakang hangat bertema Mangkasara -->
  <rect width="600" height="450" fill="url(#warmBg)" />
  
  <!-- Lingkaran piring lembut di tengah -->
  <circle cx="300" cy="205" r="105" fill="#FBF9F5" stroke="#E9E2D9" stroke-width="3" />
  <circle cx="300" cy="205" r="85" fill="none" stroke="#E9E2D9" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Ikon Tudung Saji / Mangkuk Kuliner Tradisional -->
  <g transform="translate(300, 205)">
    <!-- Uap panas / aroma rempah -->
    <path d="M-22,-45 C-26,-58 -18,-68 -22,-80" fill="none" stroke="#D18A70" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M0,-48 C-4,-62 4,-72 0,-86" fill="none" stroke="#BD6249" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M22,-45 C18,-58 26,-68 22,-80" fill="none" stroke="#D18A70" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    
    <!-- Mangkuk / Cloche base -->
    <path d="M -48,15 L 48,15 C 44,38 24,48 0,48 C -24,48 -44,38 -48,15 Z" fill="url(#terracottaGrad)" />
    
    <!-- Penutup saji / kubah tudung -->
    <path d="M -44,5 C -44,-28 44,-28 44,5 Z" fill="#302821" opacity="0.85" />
    
    <!-- Pegangan kubah -->
    <circle cx="0" cy="-30" r="6" fill="#BD6249" />
    <rect x="-3" y="-24" width="6" height="4" rx="2" fill="#302821" />
    
    <!-- Garis piring bawah -->
    <ellipse cx="0" cy="24" rx="58" ry="4" fill="#302821" opacity="0.1" />
  </g>
  
  <!-- Teks Informasi Placeholder -->
  <text x="300" y="340" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#302821" letter-spacing="0.5">
    Foto Dokumentasi Segera Hadir
  </text>
  <text x="300" y="366" text-anchor="middle" font-family="'DM Sans', -apple-system, sans-serif" font-size="13" fill="#82786F" letter-spacing="0.3">
    MANGKASARA • Kuliner Tradisional Makassar
  </text>
</svg>
